<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Emscripten-Generated Code</title>
    <meta name="viewport" content="width=device-width,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
  
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v5.13.0/js/all.js" crossorigin="anonymous"></script>

    <style>
      body, html { border: 0px none; padding: 0px; margin: 0px; width: 100%; height: 100%; overflow: hidden; position: fixed; }
      canvas.emscripten {
                       image-rendering: crisp-edges; 
                       image-rendering: pixelated;
                       aspect-ratio: 4/3;
                       max-height: 100vh;
                       max-width: 100vw;
                       width: min(100vw, calc(100vh * 1.333));
                       height: min(100vh, calc(100vw / 1.333));
                       overflow: hidden;
                       display: block;
                       position: absolute;
                       top: 0; bottom: 0; left: 0; right: 0;
                       margin: auto;
                   }
      .emscripten_border { width: 100%; height: 100%; border: 0px none !important;}
      hr { display: none; }

      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten { font-family: monospace; width: 80%; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: 1px solid black; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; }

      .spinner {
        height: 50px;
        width: 50px;
        margin: 0px auto;
        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border-left: 10px solid rgb(0,150,240);
        border-right: 10px solid rgb(0,150,240);
        border-bottom: 10px solid rgb(0,150,240);
        border-top: 10px solid rgb(100,0,200);
        border-radius: 100%;
        background-color: rgb(200,100,250);
      }
      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }



  /* Portrait */
  @media (orientation: portrait) {
  body, html {
    justify-content: flex-start;
  }

  canvas.emscripten {
    top: 0;
    bottom: auto;
    transform: translateY(0);
    max-height: 100vh;
    width: 100vw; /* Added to stretch canvas to full width */
    -webkit-user-select: none; /* Safari */
    -ms-user-select: none; /* IE 10 and IE 11 */
    user-select: none; /* Standard syntax */
  }
}

.button {
  display: inline-block;
  width: 75px;
  height: 75px;
  background-color: rgba(255, 255, 255, 0.205);
  border: none;
  outline: none;
  cursor: pointer;
  transition: background-color 0.2s;
  border-radius: 27px;
  font-size: 35px;
  color: rgba(255, 255, 255, 0.295);
  -webkit-tap-highlight-color: transparent; /* Added to remove tap highlight */
  -webkit-touch-callout: none; /* Added to disable touch callout */
  touch-action: manipulation; /* Added to disable default touch actions */
  -webkit-user-select: none; /* Safari */
    -ms-user-select: none; /* IE 10 and IE 11 */
    user-select: none; /* Standard syntax */
}



#container {
  text-align: center;
  -webkit-user-select: none; /* Safari */
    -ms-user-select: none; /* IE 10 and IE 11 */
    user-select: none; /* Standard syntax */
}

#upButton {
  margin-bottom: -10px;
}

#downButton {
  margin-top: -10px;
}

#leftButton {
  margin-right: 23px;
}

#rightButton {
  margin-left: 23px;
}

/* Landscape */
@media (orientation: landscape) {
  #container {
    position: fixed;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
  }

  #spaceButton {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 200px;
    height: 300px;
  }
}

/* Portrait */
@media (orientation: portrait) {
  #container {
    position: fixed;
    bottom: 40px;
    left: 8%;
  }

  #spaceButton {
    position: fixed;
    right: 8%;
    bottom: 40px;
    width: 100px;
    height: 215px;
  }

  #upButton {
  margin-bottom: -5px;
  }

  #downButton {
    margin-top: -5px;
  }

  #leftButton {
    margin-right: 25px;
  }

  #rightButton {
    margin-left: 25px;
  }

  .button 
  {
  display: inline-block;
  width: 70px;
  height: 70px;
  background-color: rgba(255, 255, 255, 0.205);
  border: none;
  outline: none;
  cursor: pointer;
  transition: background-color 0.2s;
  border-radius: 20px;
  font-size: 20px;
  color: rgba(255, 255, 255, 0.295);

}
}


    </style>
  </head>
  <body style="background-color: rgb(31, 31, 31)">

    <hr/>
    <figure style="overflow:visible;" id="spinner"><div class="spinner"></div><center style="margin-top:0.5em"><strong>emscripten</strong></center></figure>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>  
    </div>
    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <hr/>
    <div class="emscripten">
      <input type="checkbox" id="resize">Resize canvas
      <input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer
      &nbsp;&nbsp;&nbsp;
      <input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, 
                                                                                document.getElementById('resize').checked)">
    </div>

    <hr/>
    <textarea class="emscripten" id="output" rows="8"></textarea>
    <hr>

    <div id="container">
      <button class="button" id="upButton"><i class="fas fa-arrow-up"></i></button><br>
      <button class="button" id="leftButton"><i class="fas fa-arrow-left"></i></button>
      <button class="button" id="rightButton"><i class="fas fa-arrow-right"></i></button><br>
      <button class="button" id="downButton"><i class="fas fa-arrow-down"></i></button>
    </div>
    <button class="button" id="spaceButton"><i class="fas fa-rocket"></i></button>
    

    
    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');

      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
          var element = document.getElementById('output');
          if (element) element.value = ''; // clear browser cache
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            console.log(text);
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight; // focus on bottom
            }
          };
        })(),
        canvas: (() => {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", (e) => { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        setStatus: (text) => {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: (left) => {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = () => {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };


 

      let keyState = {};

      const dispatchEvent = (keyCode, eventType) => {
        const event = new KeyboardEvent(eventType, {
          key: String.fromCharCode(keyCode),
          code: `Key${String.fromCharCode(keyCode)}`,
          which: keyCode,
          keyCode: keyCode,
          bubbles: true
        });

        window.dispatchEvent(event);
      };

      const startKeyPress = (keyCode) => {
        if (!keyState[keyCode]) {
          keyState[keyCode] = true;
          dispatchEvent(keyCode, 'keydown');
        }
      };

      const stopKeyPress = (keyCode) => {
        if (keyState[keyCode]) {
          keyState[keyCode] = false;
          dispatchEvent(keyCode, 'keyup');
        }
      };

      const spaceButton = document.getElementById('spaceButton');
      spaceButton.addEventListener('touchstart', () => startKeyPress(32));
      spaceButton.addEventListener('touchend', () => stopKeyPress(32));

      const upButton = document.getElementById('upButton');
      upButton.addEventListener('touchstart', () => startKeyPress(87));
      upButton.addEventListener('touchend', () => stopKeyPress(87));

      const leftButton = document.getElementById('leftButton');
      leftButton.addEventListener('touchstart', () => startKeyPress(65));
      leftButton.addEventListener('touchend', () => stopKeyPress(65));

      const rightButton = document.getElementById('rightButton');
      rightButton.addEventListener('touchstart', () => startKeyPress(68));
      rightButton.addEventListener('touchend', () => stopKeyPress(68));

      const downButton = document.getElementById('downButton');
      downButton.addEventListener('touchstart', () => startKeyPress(83));
      downButton.addEventListener('touchend', () => stopKeyPress(83));


    </script>
    <script async type="text/javascript" src="AfterBurnerII.js"></script>



  </body>
</html>
